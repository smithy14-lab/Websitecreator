<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Site unavailable</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: #f7f8fb;
    color: #1a1a1a;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 2rem;
    margin: 0;
  }
  .card {
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 2.5rem 2rem;
    max-width: 440px;
    text-align: center;
  }
  h1 { font-size: 1.4rem; margin-bottom: 0.75rem; }
  p { color: #475569; margin-bottom: 1.5rem; line-height: 1.55; }
  a.btn {
    display: inline-block;
    background: #2563eb;
    color: white;
    padding: 0.7rem 1.4rem;
    border-radius: 6px;
    text-decoration: none;
    font-weight: 600;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>This site is no longer active.</h1>
    <p>The subscription for this website has ended. If you're the business owner and want to bring it back online, reactivate it below.</p>
    {% if lead.slug %}
    <a class="btn" href="{{ base_url }}/claim/{{ lead.slug }}">Reactivate site</a>
    {% endif %}
  </div>
</body>
</html>
