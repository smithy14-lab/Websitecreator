<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Website Creator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: #f7f8fb;
    color: #1a1a1a;
    min-height: 100vh;
    display: grid;
    place-items: center;
  }
  .box {
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    padding: 2.25rem 2rem;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.04);
  }
  h1 { font-size: 1.25rem; margin-bottom: 0.25rem; }
  .sub { color: #6b7280; font-size: 0.9rem; margin-bottom: 1.5rem; }
  label { font-size: 0.85rem; color: #6b7280; display: block; margin-bottom: 0.4rem; }
  input[type=password] {
    width: 100%;
    padding: 0.7rem 0.85rem;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    font-size: 1rem;
  }
  .btn {
    width: 100%;
    background: #2563eb;
    color: white;
    border: none;
    padding: 0.75rem;
    border-radius: 6px;
    font-size: 1rem;
    cursor: pointer;
    font-weight: 600;
    margin-top: 1rem;
  }
  .btn:hover { background: #1d4ed8; }
  .err {
    background: #fee2e2;
    color: #991b1b;
    padding: 0.6rem 0.8rem;
    border-radius: 6px;
    font-size: 0.85rem;
    margin-bottom: 1rem;
  }
</style>
</head>
<body>
  <div class="box">
    <h1>Website Creator</h1>
    <div class="sub">Admin sign-in.</div>
    {% with messages = get_flashed_messages() %}
      {% for m in messages %}
        <div class="err">{{ m }}</div>
      {% endfor %}
    {% endwith %}
    <form method="post">
      <label for="password">Password</label>
      <input type="password" name="password" id="password" autofocus required>
      <button class="btn" type="submit">Sign in</button>
    </form>
  </div>
</body>
</html>
